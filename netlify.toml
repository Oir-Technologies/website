# Oir Technologies — Netlify configuration (static site, no build step)
[build]
  publish = "."
  command = ""

# Clean primary URL for the AI Operations landing page.
# 1) Normalize the trailing-slash form to the canonical no-slash URL.
[[redirects]]
  from = "/ai-operations/"
  to = "/ai-operations"
  status = 301
# 2) Serve ai-operations.html at the clean /ai-operations URL (no visible .html).
#    Relative asset paths resolve to /assets/* correctly from this URL.
[[redirects]]
  from = "/ai-operations"
  to = "/ai-operations.html"
  status = 200

# Long-lived, immutable caching for fingerprint-safe static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate so content updates appear immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security headers for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# sitemap.xml and robots.txt are served from the repo root as-is.
# Optional: enable "Pretty URLs" in Netlify (Site settings → Build & deploy →
# Post processing) to serve /products from products.html. Canonicals currently
# use the .html form, so no redirects are required.
